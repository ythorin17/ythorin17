="700" fill="#E2542F">ONNX Runtime</text><text x="78" y="81" font-size="13" fill="#8b949e">One runtime for many backends: the neutral graph format you export to, then execute on CPU, CUDA, or an NPU without</text><text x="78" y="98" font-size="13" fill="#8b949e">rewriting your Python.</text><path d="M78 109 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
