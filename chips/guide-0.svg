<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" width="860" height="446" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif"><title>VISION field guide</title>
<rect x="1" y="1" width="858" height="444" rx="14" fill="#7FA36B" fill-opacity="0.05" stroke="#7FA36B" stroke-opacity="0.4" stroke-width="1.2"/>
<g transform="translate(30,26)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="0" cy="-6.5" r="3.4" fill="#5E8B4F"/><circle cx="6.2" cy="-2" r="3.4" fill="#5E8B4F"/><circle cx="3.8" cy="5.3" r="3.4" fill="#5E8B4F"/><circle cx="-3.8" cy="5.3" r="3.4" fill="#5E8B4F"/><circle cx="-6.2" cy="-2" r="3.4" fill="#5E8B4F"/></g><circle r="2.8" fill="#5E8B4F"/></g>
<text x="48" y="30" font-size="11" letter-spacing="2" fill="#8b949e">VISION</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><rect x="30" y="60" width="34" height="34" rx="9" fill="#E2542F" fill-opacity="0.12"/><g transform="translate(38,68) scale(0.75)"><path d="M11.8992.8525C8.735.8525 6.17 3.4175 6.17 6.5817c0 2.102 1.1321 3.9398 2.8198 4.9366l1.6412-2.7849c.0411-.0699.0176-.1593-.0495-.2048-.6233-.4227-1.0328-1.137-1.0328-1.947 0-1.298 1.0524-2.3504 2.3505-2.3504 1.2981 0 2.3505 1.0524 2.3505 2.3505 0 .8098-.4095 1.5242-1.0328 1.947-.0671.0454-.0907.1348-.0495.2047l1.6414 2.785c1.6878-.9969 2.8199-2.8346 2.8199-4.9367 0-3.1642-2.5653-5.7292-5.7295-5.7292zm-6.17 10.8366C2.565 11.6891 0 14.2541 0 17.4183c0 3.1642 2.565 5.7292 5.7292 5.7292 3.1798 0 5.8074-2.6995 5.7275-5.8762H8.2313c-.0847 0-.1513.0717-.1519.1564-.0082 1.266-1.0644 2.3411-2.3502 2.3411-1.2981 0-2.3505-1.0524-2.3505-2.3505 0-1.2982 1.0524-2.3505 2.3505-2.3505.34 0 .663.0724.9547.2022.0713.0318.1566.0077.1962-.0595l1.6464-2.7935c-.8273-.4636-1.7815-.7279-2.7973-.7279zm15.4424.7614l-1.6366 2.7878c-.041.07-.0172.1594.05.2048.624.4217 1.0348 1.1354 1.0363 1.9452.0022 1.298-1.0483 2.352-2.3465 2.3542-1.298.0023-2.3523-1.0482-2.3545-2.3462-.0015-.8098.4068-1.5248 1.0294-1.9486.067-.0457.0905-.1353.0492-.2051l-1.6464-2.7818c-1.6859.9998-2.8146 2.8394-2.811 4.9415.0056 3.1641 2.575 5.7248 5.7393 5.7192 3.1641-.0054 5.7246-2.575 5.7192-5.7392-.0037-2.1022-1.139-3.938-2.8284-4.9318z" fill="#E2542F"/></g><text x="78" y="63" font-size="14" font-weight="700" fill="#E2542F">OpenCV</text><text x="78" y="81" font-size="13" fill="#8b949e">The default toolkit for classical vision: image I/O, filtering, contours, feature matching, camera calibration, and a DNN</text><text x="78" y="98" font-size="13" fill="#8b949e">module for running exported networks.</text><path d="M78 109 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/><rect x="30" y="126" width="34" height="34" rx="9" fill="#F4795B" fill-opacity="0.12"/><g transform="translate(38,134) scale(0.75)"><path d="M18.25 0c-3.05 0-5.52 2.477-5.52 5.523 0 3.842-3.125 6.967-6.972 6.967-1.506 0-2.894-.46-4.03-1.26 1.105 1.98 2.765 3.6 4.759 4.67v2.51c0 3.04 2.428 5.56 5.463 5.59 3.07 0 5.58-2.46 5.58-5.52V15.9c3.64-1.96 6.16-5.8 6.23-10.208v-.165C23.76 2.477 21.28 0 18.25 0ZM5.758.0002C2.715.0002.2399 2.477.2399 5.523c0 3.044 2.4751 5.517 5.5181 5.517 3.044 0 5.512-2.473 5.512-5.517 0-3.046-2.468-5.5228-5.512-5.5228Z" fill="#F4795B"/></g><text x="78" y="129" font-size="14" font-weight="700" fill="#F4795B">YOLO</text><text x="78" y="147" font-size="13" fill="#8b949e">Single-shot object detection — one forward pass gives boxes and classes, which is why it is the usual starting point for</text><text x="78" y="164" font-size="13" fill="#8b949e">real-time detection on modest hardware.</text><path d="M78 175 H 812" stroke="#F4795B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><rect x="30" y="192" width="34" height="34" rx="9" fill="#ED8B66" fill-opacity="0.12"/><g transform="translate(38,200) scale(0.75)"><path d="m12.736 7.341-.002 2.897c.012 3.953-3.188 7.177-7.098 7.171-1.553-.003-2.967-.48-4.112-1.313 2.056 3.725 5.999 6.24 10.48 6.245 6.511-.003 11.891-5.343 11.992-11.91l-.002-.027c.006-.151 0-2.951.006-3.075-.01-3.116-2.538-5.677-5.63-5.67-3.105-.006-5.645 2.54-5.634 5.683zM5.629 4.573C2.525 4.573 0 7.118 0 10.246s2.525 5.673 5.63 5.673c3.103 0 5.629-2.545 5.629-5.673s-2.526-5.673-5.63-5.673" fill="#ED8B66"/></g><text x="78" y="195" font-size="14" font-weight="700" fill="#ED8B66">Ultralytics</text><text x="78" y="213" font-size="13" fill="#8b949e">The YOLO training and export toolkit: train, validate, and export to ONNX, TensorRT, TFLite, NCNN or CoreML from one</text><text x="78" y="230" font-size="13" fill="#8b949e">CLI or a few lines of Python.</text><path d="M78 241 H 812" stroke="#ED8B66" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/><rect x="30" y="258" width="34" height="34" rx="9" fill="#7FA36B" fill-opacity="0.12"/><g transform="translate(38,266) scale(0.75)"><path d="M2.182 0C1 0 .037.94.002 2.114L0 2.182v6.545a2.182 2.182 0 0 0 4.364 0V2.182A2.182 2.182 0 0 0 2.182 0Zm6.545 0c-1.182 0-2.145.94-2.18 2.114l-.002.068v13.09a2.182 2.182 0 0 0 4.364 0V2.183A2.182 2.182 0 0 0 8.727 0Zm6.546 0a2.182 2.182 0 0 0-2.182 2.182 2.182 2.182 0 0 0 2.182 2.182 2.182 2.182 0 0 0 2.182-2.182A2.182 2.182 0 0 0 15.273 0Zm6.545 0c-1.182 0-2.145.94-2.18 2.114l-.002.068v19.636a2.182 2.182 0 0 0 4.364 0V2.182A2.182 2.182 0 0 0 21.818 0Zm-6.545 6.545c-1.183 0-2.145.94-2.181 2.114l-.001.068v13.091a2.182 2.182 0 0 0 4.364 0V8.728a2.182 2.182 0 0 0-2.182-2.183zM2.182 13.091c-1.182 0-2.145.94-2.18 2.114L0 15.273v6.545a2.182 2.182 0 0 0 4.364 0v-6.545a2.182 2.182 0 0 0-2.182-2.182zm6.545 6.545a2.182 2.182 0 0 0-2.182 2.182A2.182 2.182 0 0 0 8.727 24a2.182 2.182 0 0 0 2.182-2.182 2.182 2.182 0 0 0-2.182-2.182Z" fill="#7FA36B"/></g><text x="78" y="261" font-size="14" font-weight="700" fill="#7FA36B">MediaPipe</text><text x="78" y="279" font-size="13" fill="#8b949e">Google&#x27;s on-device perception pipeline: face, hand, and pose landmarks as ready-made graphs that keep a usable frame</text><text x="78" y="296" font-size="13" fill="#8b949e">rate on mobile and SBCs.</text><path d="M78 307 H 812" stroke="#7FA36B" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><rect x="30" y="324" width="34" height="34" rx="9" fill="#E2542F" fill-opacity="0.12"/><text x="47" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#E2542F">A</text><text x="78" y="327" font-size="14" font-weight="700" fill="#E2542F">Albumentations</text><text x="78" y="345" font-size="13" fill="#8b949e">Fast image augmentation: flips, colour jitter, blur, cutout, and bounding-box aware transforms that keep labels aligned with</text><text x="78" y="362" font-size="13" fill="#8b949e">the pixels they describe.</text><path d="M78 373 H 812" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/><rect x="30" y="390" width="34" height="34" rx="9" fill="#F4795B" fill-opacity="0.12"/><g transform="translate(38,398) scale(0.75)"><path d="M10.315 4.876L6.3048 2.8517l-4.401 2.1965 4.1186 2.0683zm1.8381.9277l4.2045 2.1223-4.3622 2.1906-4.125-2.0718zm5.6153-2.9213l4.3193 2.1658-3.863 1.9402-4.2131-2.1252zm-1.859-.9329L12.021 0 8.1742 1.9193l4.0068 2.0208zm-3.0401 16.7443V24l4.7107-2.3507-.0053-5.3085zm4.7037-4.2057l-.0052-5.2528-4.6985 2.3356v5.2546zm5.6553-.9845v5.327l-4.0178 2.0052-.0029-5.3028zm0-1.8626V6.4214l-4.0253 2.001.0034 5.2633zM11.2062 11.571L8.0333 9.9756v6.895s-3.8804-8.2564-4.2399-8.998c-.0463-.0957-.2371-.2007-.2858-.2262C2.8118 7.2812.773 6.2485.773 6.2485V18.43l2.8204 1.5076v-6.3674s3.8392 7.3775 3.878 7.458c.0389.0807.4245.8582.8362 1.1314.5485.363 2.8992 1.7766 2.8992 1.7766z" fill="#F4795B"/></g><text x="78" y="393" font-size="14" font-weight="700" fill="#F4795B">NumPy</text><text x="78" y="411" font-size="13" fill="#8b949e">The array layer everything else sits on — and where the pixel maths actually happens once a frame leaves the camera.</text></g>
</svg>
