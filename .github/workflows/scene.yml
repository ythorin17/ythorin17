# Living scene: repaints header.svg to match the real weather in Wuhan,
# and draws the seasonal garden footer. https://github.com/yuki4266/living-scene
name: Living scene

on:
  schedule:
    # every three hours, at :23 past — off the hour, because scheduled runs
    # at :00 queue behind everyone else's cron and get delayed
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      weather:
        description: "Pin the weather — clear/clouds/rain/snow/fog/storm. Blank uses the real forecast."
        required: false
        default: ""
      season:
        description: "Pin the season — spring/summer/autumn/winter. Blank uses today's date."
        required: false
        default: ""
      force:
        description: "Re-render even if the scene has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # paints the live weather into the banner (between its <!--WEATHER--> markers),
      # writes header-night.svg next to it, and REDRAWS both garden footers
      - uses: yuki4266/living-scene@v1
        with:
          lat: "30.5928"          # Wuhan, Hubei
          lon: "114.3055"
          tz: Asia/Shanghai
          header: header.svg
          sky: "false"
          weather: ${{ inputs.weather }}
          season: ${{ inputs.season }}
          force: ${{ inputs.force }}
          commit-message: "🌦 scene sync: {state}"

      # The windmill has to go in AFTER living-scene: that action rewrites both
      # garden footers from scratch on every run, so anything injected earlier is
      # thrown away. Running last also means this step is what re-adds the windmill
      # when the season changes and the footers are replaced.
      #
      # wind.py only rewrites the spin when the real wind moved a quarter km/h, so
      # a steady breeze changes nothing and git records no commit.
      - name: paint the windmill and set its spin to the current wind
        if: always()
        env:
          SCENE_LAT: "30.5928"
          SCENE_LON: "114.3055"
          SCENE_TZ: Asia/Shanghai
          FORCE: ${{ inputs.force }}
        run: python3 scripts/wind.py

      - name: commit the windmill
        if: always()
        env:
          BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "windmill unchanged — nothing to commit"
            exit 0
          fi
          SPEED=$(grep -o 'class="wm-base"[^>]*dur="[0-9.]*s"' header.svg | head -1 || true)
          git commit -m "🌬 windmill sync  ${SPEED:-spin refresh}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
