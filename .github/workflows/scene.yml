# Living scene: repaints header.svg to match the real weather in Wuhan,
# and draws the seasonal garden footer. https://github.com/yuki4266/living-scene
name: Living scene

on:
  schedule:
    # every three hours, at :23 past — off the hour, because scheduled runs
    # at :00 queue behind everyone else's cron and get delayed
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      weather:
        description: "Pin the weather — clear/clouds/rain/snow/fog/storm. Blank uses the real forecast."
        required: false
        default: ""
      season:
        description: "Pin the season — spring/summer/autumn/winter. Blank uses today's date."
        required: false
        default: ""
      force:
        description: "Re-render even if the scene has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # the windmill is ours, not living-scene's: it lives outside the
      # <!--WEATHER--> markers, so this only rewrites its spin speed, and only
      # when the real wind has moved a quarter km/h. Runs first so the commit
      # below sweeps both changes up together.
      - name: refresh the windmill's spin to the current wind
        if: always()
        env:
          SCENE_LAT: "30.5928"
          SCENE_LON: "114.3055"
          SCENE_TZ: Asia/Shanghai
          FORCE: ${{ inputs.force }}
        run: python3 scripts/wind.py

      # paints the live weather into the banner (between its <!--WEATHER--> markers),
      # writes header-night.svg next to it, and draws the seasonal footer
      - uses: yuki4266/living-scene@v1
        with:
          lat: "30.5928"          # Wuhan, Hubei
          lon: "114.3055"
          tz: Asia/Shanghai
          header: header.svg
          sky: "false"
          weather: ${{ inputs.weather }}
          season: ${{ inputs.season }}
          force: ${{ inputs.force }}
          commit-message: "🌦 scene sync: {state}"

      # living-scene only commits the files it owns, so pick up the windmill too
      - name: commit the windmill if the wind moved it
        if: always()
        env:
          BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.svg header-night.svg
          if git diff --cached --quiet; then
            echo "windmill unchanged"
            exit 0
          fi
          SPEED=$(grep -o 'class="wm-css0"[^>]*dur="[0-9.]*s"' header.svg | head -1 || true)
          git commit -m "🌬 windmill sync: ${SPEED:-spin refresh}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
